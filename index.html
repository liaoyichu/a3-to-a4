<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A3 试卷转 A4</title>
<script src="https://cdn.bootcdn.net/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root { --ink:#1c1c1e; --dim:#6b6b70; --line:#e3e3e6; --brand:#07c160; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin:0; padding:20px 16px 48px; color:var(--ink); background:#f7f7f8;
    font: 16px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 6px; }
  .lede { color:var(--dim); font-size:14px; margin:0 0 20px; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px;
          box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .pick { display:block; text-align:center; padding:22px 12px; border-radius:12px;
          border:2px dashed var(--line); color:var(--brand); font-weight:600;
          font-size:17px; cursor:pointer; }
  .pick.has-file { border-style:solid; border-color:var(--brand); background:#f2fdf6; color:var(--ink); }
  .pick small { display:block; color:var(--dim); font-weight:400; font-size:13px;
                margin-top:4px; overflow-wrap:anywhere; }
  .pick input { display:none; }
  #picktext { overflow-wrap:anywhere; }
  .grp { margin:14px 0 0; }
  .grp .label { font-size:13px; color:var(--dim); margin-bottom:8px; }
  .seg { display:flex; gap:8px; flex-wrap:wrap; }
  .seg button { flex:1 1 auto; min-width:88px; padding:11px 8px; font-size:15px;
    border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--ink);
    font-family:inherit; }
  .seg button[aria-pressed="true"] { border-color:var(--brand); background:#f2fdf6;
    color:#067a3d; font-weight:600; }
  .go { width:100%; margin-top:16px; padding:15px; border:0; border-radius:12px;
        background:var(--brand); color:#fff; font-size:17px; font-weight:600;
        font-family:inherit; }
  .go:disabled { background:#c8c8cc; }
  .hint { font-size:13px; color:var(--dim); margin-top:10px; }
  .err { color:#c0392b; font-size:14px; margin-top:10px; white-space:pre-wrap; }
  .status { display:none; align-items:center; gap:10px; font-size:15px; }
  .status.on { display:flex; }
  .spin { width:18px; height:18px; border:2px solid var(--line); border-top-color:var(--brand);
          border-radius:50%; animation:sp .8s linear infinite; flex:none; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #result { display:none; }
  .dl { display:block; text-align:center; padding:14px; border-radius:12px;
        background:#eef6ff; color:#0b64c8; font-weight:600; text-decoration:none;
        margin-bottom:8px; }
  .dl.off { background:#f1f1f3; color:#9a9aa0; pointer-events:none; }
  .shot { width:100%; border:1px solid var(--line); border-radius:8px; margin-top:10px;
          background:#fff; display:block; }
  .shotno { font-size:13px; color:var(--dim); margin-top:16px;
            display:flex; justify-content:space-between; gap:8px; }
  .shotno a { color:#0b64c8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>A3 试卷转 A4</h1>
  <p class="lede">上传 A3 的试卷（PDF 或拍照的图片），转成一张一张 A4。全部在你的手机上完成，文件不会上传到任何地方。</p>

  <div class="card">
    <label class="pick" id="pick">
      <input id="file" type="file" accept="application/pdf,image/*">
      <span id="picktext">点这里选文件</span>
      <small id="picksub">支持 PDF、JPG、PNG</small>
    </label>

    <div class="grp">
      <div class="label">怎么拆</div>
      <div class="seg" id="mode">
        <button data-v="auto" aria-pressed="true">自动</button>
        <button data-v="lr">左右对半</button>
        <button data-v="tb">上下对半</button>
        <button data-v="fit">整页缩放</button>
      </div>
      <div class="hint" id="modehint"></div>
    </div>

    <div class="grp">
      <div class="label">清晰度</div>
      <div class="seg" id="q">
        <button data-v="150" aria-pressed="true">标准</button>
        <button data-v="220">高清</button>
      </div>
      <div class="hint">试卷建议用「标准」，文件小、微信发得出去。</div>
    </div>

    <button class="go" id="go" disabled>开始转换</button>
    <div class="err" id="err"></div>
  </div>

  <div class="card">
    <div class="status" id="status"><div class="spin"></div><span id="statustext">正在转换…</span></div>
  </div>

  <div class="card" id="result">
    <div class="label" style="font-size:13px;color:#6b6b70;margin-bottom:10px">转换完成</div>
    <a class="dl" id="pdf" href="#" download="A4.pdf">下载 A4 的 PDF（打印用）</a>
    <div class="hint">下面每张就是一张 A4。<b>长按图片可以直接保存到相册</b>，然后在微信里发给别人。</div>
    <div id="shots"></div>
  </div>
</div>

<script>
const MODE_HINT = {
  auto: "横向的 A3 按左右切开（一张变两张 A4），竖向的按上下切。",
  lr:   "每页从正中间竖着切成左右两半，各占一张 A4。",
  tb:   "每页从正中间横着切成上下两半，各占一张 A4。",
  fit:  "不拆，把整页等比缩到一张 A4 里（字会变小，适合只想看全貌）。"
};
const MAX_PX = 8000000;   // 单张源页画布上限，手机内存的安全线
const A4_RATIO = 297 / 210;

const $ = id => document.getElementById(id);
let file = null, mode = "auto", dpi = 150;

function seg(id, set) {
  const box = $(id);
  box.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    [...box.children].forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    set(b.dataset.v);
  });
}
seg("mode", v => { mode = v; $("modehint").textContent = MODE_HINT[v]; });
seg("q", v => { dpi = Number(v); });
$("modehint").textContent = MODE_HINT.auto;

$("file").addEventListener("change", e => {
  file = e.target.files[0] || null;
  $("err").textContent = "";
  $("result").style.display = "none";
  if (!file) return;
  $("pick").classList.add("has-file");
  $("picktext").textContent = file.name;
  $("picksub").textContent = "点一下可以换一份";
  $("go").disabled = false;
});

/* ---------- 源页：统一成 canvas ---------- */

// PDF 整页渲染时的缩放：按目标清晰度，但不让整页画布超过 MAX_PX
function pageScale(wPt, hPt, targetDpi) {
  const wIn = wPt / 72, hIn = hPt / 72;
  const cap = Math.sqrt(MAX_PX / (wIn * hIn));
  return Math.max(110, Math.min(targetDpi, cap)) / 72;
}

async function* sourcePages(f) {
  const isPdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
  if (isPdf) {
    if (typeof pdfjsLib === "undefined") throw new Error("PDF 组件没加载出来，检查一下网络再刷新");
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.bootcdn.net/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
    for (let n = 1; n <= doc.numPages; n++) {
      const page = await doc.getPage(n);
      const vp0 = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: pageScale(vp0.width, vp0.height, dpi) });
      const c = document.createElement("canvas");
      c.width = Math.round(vp.width);
      c.height = Math.round(vp.height);
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, c.width, c.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      page.cleanup();
      yield { canvas: c, no: n, total: doc.numPages };
    }
    await doc.destroy();
    return;
  }

  // 图片：照片本来就够大，直接按像素上限缩一下
  const url = URL.createObjectURL(f);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error("这张图片读不出来"));
      i.src = url;
    });
    let k = 1, w = img.naturalWidth, h = img.naturalHeight;
    if (w * h > MAX_PX) k = Math.sqrt(MAX_PX / (w * h));
    const c = document.createElement("canvas");
    c.width = Math.round(w * k);
    c.height = Math.round(h * k);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    yield { canvas: c, no: 1, total: 1 };
  } finally {
    URL.revokeObjectURL(url);
  }
}

/* ---------- 拆成一页页 A4 ---------- */

// 把 src 里 [sx,sy,sw,sh] 这块，放到一张 A4 画布上。
// 横的一块出横向 A4，竖的一块出竖向 A4（试卷切出来是哪种就是哪种，不硬转）；
// 长边像素跟源保持一致，所以不会二次放大变糊；比例不满的地方留白。
function toA4(src, sx, sy, sw, sh, capLong) {
  const longPx = Math.max(240, Math.min(Math.round(Math.max(sw, sh)), capLong || Infinity));
  const land = sw >= sh;
  const W = land ? longPx : Math.round(longPx / A4_RATIO);
  const H = land ? Math.round(longPx / A4_RATIO) : longPx;

  const c = document.createElement("canvas");
  c.width = W;
  c.height = H;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, W, H);
  const k = Math.min(W / sw, H / sh);
  const dw = sw * k, dh = sh * k;
  ctx.drawImage(src, sx, sy, sw, sh, (W - dw) / 2, (H - dh) / 2, dw, dh);
  return c;
}

const A4_LONG_MAX = 3508;   // A4@300dpi，拆页时用不着限制，写个上限兜底

function cut(srcCanvas, m) {
  const { width: W, height: H } = srcCanvas;
  if (m === "fit") {
    return [toA4(srcCanvas, 0, 0, W, H, Math.round(2339 * 1.0))];
  }
  if (m === "lr") {
    const half = Math.round(W / 2);
    return [toA4(srcCanvas, 0, 0, half, H, A4_LONG_MAX),
            toA4(srcCanvas, W - half, 0, W - half, H, A4_LONG_MAX)];
  }
  const half = Math.round(H / 2);
  return [toA4(srcCanvas, 0, 0, W, half, A4_LONG_MAX),
          toA4(srcCanvas, 0, H - half, W, H - half, A4_LONG_MAX)];
}

function pickMode(w, h) {
  if (mode !== "auto") return mode;
  return w > h ? "lr" : "tb";
}

const toBlob = c => new Promise(r => c.toBlob(r, "image/jpeg", 0.85));

/* ---------- 跑起来 ---------- */

$("go").addEventListener("click", async () => {
  if (!file) return;
  const btn = $("go");
  btn.disabled = true;
  $("err").textContent = "";
  $("result").style.display = "none";
  $("status").classList.add("on");
  $("shots").innerHTML = "";

  const setStatus = t => { $("statustext").textContent = t; };
  const urls = [];
  const jpegs = [];

  try {
    setStatus("正在读取…");
    let done = 0;
    for await (const page of sourcePages(file)) {
      const m = pickMode(page.canvas.width, page.canvas.height);
      const cutPages = cut(page.canvas, m);
      for (const c of cutPages) {
        const blob = await toBlob(c);
        if (!blob) throw new Error("生成图片失败，可能是文件太大");
        jpegs.push(await blob.arrayBuffer());
        urls.push(URL.createObjectURL(blob));
        done++;
        setStatus(`已转出 ${done} 页…`);
      }
      // 主动释放，手机上内存很紧
      page.canvas.width = page.canvas.height = 0;
      $("status").scrollIntoView({ block: "nearest" });
    }

    urls.forEach((u, i) => {
      const no = document.createElement("div");
      no.className = "shotno";
      const t = document.createElement("span");
      t.textContent = `第 ${i + 1} 页（A4）`;
      const a = document.createElement("a");
      a.href = u;
      a.download = `A4-${i + 1}.jpg`;
      a.textContent = "下载这张";
      no.append(t, a);
      const img = document.createElement("img");
      img.className = "shot";
      img.loading = "lazy";
      img.src = u;
      $("shots").append(no, img);
    });

    $("status").classList.remove("on");
    $("result").style.display = "block";
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
    buildPdf(jpegs).catch(() => { $("pdf").classList.add("off"); });
  } catch (ex) {
    $("status").classList.remove("on");
    $("err").textContent = "出错了：" + ex.message;
  } finally {
    btn.disabled = false;
  }
});

// 用 pdf-lib 把刚才的 JPEG 拼成 A4 的 PDF；库没加载出来就灰掉这个按钮
async function buildPdf(jpegs) {
  if (typeof PDFLib === "undefined") throw new Error("no pdf-lib");
  const doc = await PDFLib.PDFDocument.create();
  for (const buf of jpegs) {
    const img = await doc.embedJpg(buf);
    const p = doc.addPage([595.276, 841.89]);
    p.drawImage(img, { x: 0, y: 0, width: 595.276, height: 841.89 });
  }
  const bytes = await doc.save();
  const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
  const a = $("pdf");
  a.href = url;
  a.classList.remove("off");
}
</script>
</body>
</html>
